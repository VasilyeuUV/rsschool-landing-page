<section id="favorite" class="wrapper wrapper__section favorite">
    <div class="wrapper__favorite">

        <h2 class="favorite__title">
            Choose your <em class="title__accent">favorite</em> coffee
        </h2>

        <div class="favorite__slider">

            <button class="favorite__slider--button button__prev" type="button" aria-label="Previous slide">
                <span aria-hidden="true">&larr;</span>
            </button>

            <div class="favorite__slider--viewport">
                <div class="favorite__slider--track">

                    <article class="favorite__slider--slide">
                        <img class="favorite__slider--image" src="./assets/img/coffee/coffee-slider-1.png"
                            alt="S'mores Frappuccino">

                        <div class="favorite__slider--content">
                            <h3 class="favorite__slider--content-name">
                                S’mores Frappuccino
                            </h3>

                            <p class="favorite__slider--content-description">
                                This new drink takes an espresso and mixes it
                                with brown sugar and cinnamon before being
                                topped with oat milk.
                            </p>

                            <p class="favorite__slider--content-price">
                                $5.50
                            </p>
                        </div>
                    </article>

                </div>
            </div>

            <button class="favorite__slider--button button__next" type="button" aria-label="Next slide">
                <span aria-hidden="true">&rarr;</span>
            </button>

        </div>

        <div class="favorite__slider--pagination"></div>

    </div>
</section>
