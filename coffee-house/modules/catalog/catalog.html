<section id="catalog" class="wrapper wrapper__section catalog">
    <div class="wrapper__catalog">

        <div class="catalog__header">

            <h1 class="catalog__title">
                Behind each of our cups hides an
                <em class="title__accent">amazing surprise</em>
            </h1>

            <nav class="catalog__categories" aria-label="catalog categories">

                <button class="catalog__category catalog__category-active" type="button" data-category="coffee">
                    <span class="catalog__category-icon">
                        <img src="./assets/icons/cap-icon.svg" alt="">
                    </span>
                    <span>Coffee</span>
                </button>

                <button class="catalog__category" type="button" data-category="tea">
                    <span class="catalog__category-icon">
                        <img src="./assets/icons/tea-icon.svg" alt="">
                    </span>
                    <span>Tea</span>
                </button>

                <button class="catalog__category" type="button" data-category="dessert">
                    <span class="catalog__category-icon">
                        <img src="./assets/icons/dessert-icon.svg" alt="">
                    </span>
                    <span>Dessert</span>
                </button>

            </nav>
        </div>

        <div class="catalog__products"></div>

    </div>
</section>
